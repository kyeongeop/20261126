<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamSync 权限管理</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --line:#e3e6ee; --ink:#1f2430; --muted:#6b7280;
          --blue:#2563eb; --green:#0f766e; --amber:#b45309; --red:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  ul.tree { list-style:none; margin:0; padding:0; }
  ul.tree ul { list-style:none; margin:0; padding-left:16px; border-left:1px dashed var(--line); }
  li.node { padding:3px 6px; border-radius:6px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  li.node:hover { background:#eef2ff; }
  li.node.active { background:#dbe4ff; font-weight:600; }
  .kind { font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.direct { background:#dcfce7; color:var(--green); }
  .badge.inherited { background:#fef3c7; color:var(--amber); }
  .lvl-none { color:var(--red); font-weight:600; }
  .chain { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
  .chain span { background:#f1f5f9; border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:12px; }
  .chain b { color:var(--blue); }
  select, button, input { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button { cursor:pointer; background:var(--blue); color:#fff; border-color:var(--blue); }
  button.secondary { background:#fff; color:var(--ink); }
  button.danger { background:var(--red); border-color:var(--red); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .src { font-size:12px; color:var(--muted); }
  #msg { margin-top:10px; font-size:13px; min-height:20px; }
  #msg.ok { color:var(--green); } #msg.err { color:var(--red); }
  .section-title { margin:18px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<header>
  <h1>TeamSync · 文件夹权限继承与覆盖</h1>
  <p>权限沿目录树向下继承，最近一级优先；移动节点后子树权限按新位置整体重算。</p>
</header>
<main>
  <section class="card">
    <h2>目录树</h2>
    <div id="tree" class="muted">加载中…</div>
    <div class="section-title">新建成员（允许同名）</div>
    <div class="row">
      <input id="newUserName" placeholder="成员姓名" style="flex:1">
      <button id="createUserBtn">添加</button>
    </div>
    <div class="section-title">在当前节点下新建</div>
    <div class="row">
      <input id="newNodeName" placeholder="名称" style="flex:1">
      <select id="newNodeKind"><option value="folder">文件夹</option><option value="file">文件</option></select>
      <button id="createNodeBtn">新建</button>
    </div>
  </section>
  <section class="card">
    <h2 id="nodeTitle">权限编辑</h2>
    <div id="chainBox" class="muted">请选择左侧节点。</div>
    <table>
      <thead><tr><th>成员（ID）</th><th>有效权限</th><th>来源级别</th><th>来源节点</th><th>操作</th></tr></thead>
      <tbody id="permBody"></tbody>
    </table>
    <div class="section-title">设置单节点覆盖（仅作用于此节点）</div>
    <div class="row">
      <select id="aceUser"></select>
      <select id="aceLevel">
        <option value="read">read 只读</option>
        <option value="write">write 可写</option>
        <option value="admin">admin 管理</option>
        <option value="none">none 显式拒绝</option>
      </select>
      <button id="setAceBtn">保存覆盖</button>
    </div>
    <div class="section-title">移动节点（移动后重算权限）</div>
    <div class="row">
      <select id="moveTarget" style="flex:1"></select>
      <button id="moveBtn">移动到此文件夹</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
