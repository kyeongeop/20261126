[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-evidence"
version = "0.1.0"
description = "Signed evidence packages for incident timelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[project.scripts]
incident-evidence = "incident_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["incident_evidence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

