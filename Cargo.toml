[package]
name = "hardening-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Multi-target binary hardening release gate (PIE/NX/RELRO/BIND_NOW/symbol evidence)."
license = "UNLICENSED"

[lib]
name = "hardening_gate"
path = "src/lib.rs"

[[bin]]
name = "hardening-gate"
path = "src/bin/hardening_gate.rs"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.10.9"
object = { version = "0.41.0", default-features = false, features = ["read", "std"] }

[profile.release]
opt-level = 2
